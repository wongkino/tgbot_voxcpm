name: tgbot_voxcpm

services:
  bot:
    image: ${DOCKER_IMAGE:-ghcr.io/wongkino/tgbot_voxcpm:latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-latest}
    pull_policy: ${PULL_POLICY:-always}
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
