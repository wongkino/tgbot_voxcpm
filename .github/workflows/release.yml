name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  version-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '#skip-version') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            version="0.1.0"
          else
            ver="${latest#v}"
            IFS=. read -r major minor patch <<< "${ver}"
            if echo "${COMMIT_MESSAGE}" | grep -qiE '(#major|breaking change)'; then
              major=$((major + 1))
              minor=0
              patch=0
            elif echo "${COMMIT_MESSAGE}" | grep -qiE '#minor'; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            version="${major}.${minor}.${patch}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "Next version: v${version} (previous: ${latest:-none})"

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=tgbot_voxcpm
            org.opencontainers.image.description=Telegram bot for VoxCPM voice cloning
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Public repo 無法呼叫 private k3s-homelab reusable workflow → 用 vendored 副本
  deploy-k3s:
    needs: version-and-publish
    uses: ./.github/workflows/update-k3s-manifest.yaml
    with:
      manifest_path: apps/diy/tgbot-voxcpm/resources.yaml
      image: ghcr.io/wongkino/tgbot_voxcpm
      tag: ${{ needs.version-and-publish.outputs.version }}
      digest: ${{ needs.version-and-publish.outputs.digest }}
    secrets:
      token: ${{ secrets.K3S_HOMELAB_PAT }}
